<div class="row">
    <div class="col-12 py-3 px-lg-3">
        {% if message %}
            {% if status %}
                <div class="alert alert-success" role="alert">
                    {{ message }}
                </div>
            {% else %}
                <div class="alert alert-danger" role="alert">
                    {{ message }}
                </div>
            {% endif %}
        {% endif %}
    </div>
</div>
